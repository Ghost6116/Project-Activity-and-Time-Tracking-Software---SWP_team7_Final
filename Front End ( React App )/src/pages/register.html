<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Tracker</title>
  <link rel="stylesheet" href="styles.css">

  <style>
  /* Reset and Base Styles */
  body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #f9f9f9;
  }

  .container {
  /*max-width: 900px;*/
  margin: 2rem auto;
  padding: 1.5rem;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }

  /* Timer Form */
  .timer-form {
  display: grid;
  gap: 1rem;
  grid-template-columns: 2fr 1fr auto;
  grid-template-areas:
  "title category timer"
  "description description description"
  "remarks remarks remarks";
  padding: 1rem 0;
  border-bottom: 2px solid #e0e0e0;
  }

  .input-title {
  grid-area: title;
  padding: 0.8rem;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 1rem;
  }

  .input-category {
  grid-area: category;
  padding: 0.8rem;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 1rem;
  }

  .timer {
  grid-area: timer;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  }

  .timer-display {
  font-size: 1.4rem;
  font-weight: bold;
  color: #333;
  }

  .btn-start {
  padding: 0.8rem 1.2rem;
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 1rem;
  cursor: pointer;
  }

  .btn-start:hover {
  background-color: #0056b3;
  }

  .input-description,
  .input-remarks {
  grid-column: span 3;
  padding: 0.8rem;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 1rem;
  resize: none;
  width: 100%;
  height: 80px;
  }

  /* Time Entries Section */
  .time-entries {
  margin-top: 2rem;
  }

  .time-entries h2 {
  font-size: 1.5rem;
  color: #333;
  margin-bottom: 1rem;
  border-bottom: 2px solid #e0e0e0;
  padding-bottom: 0.5rem;
  }

  .entry {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 1rem;
  border: 1px solid #e0e0e0;
  border-radius: 5px;
  margin-bottom: 1rem;
  background: #f9f9f9;
  }

  .entry-left {
  max-width: 60%;
  }

  .entry-left h3 {
  margin: 0;
  font-size: 1.2rem;
  color: #333;
  }

  .entry-category {
  font-size: 0.9rem;
  color: #666;
  margin: 0.3rem 0;
  }

  .entry-description {
  font-size: 0.9rem;
  color: #555;
  margin: 0.5rem 0;
  }

  .entry-right {
  text-align: right;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-end;
  gap: 0.5rem;
  }

  .entry-time .time {
  font-size: 1rem;
  font-weight: bold;
  color: #333;
  }

  .entry-time .date {
  font-size: 0.8rem;
  color: #666;
  }

  .entry-actions button {
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 1rem;
  color: #007bff;
  transition: color 0.2s ease-in-out;
  }

  .entry-actions button:hover {
  color: #0056b3;
  }

  </style>

</head>
<body>
<div class="container">
  <!-- Timer Input Form -->
  <div class="timer-form">
    <input type="text" placeholder="Add Title" class="input-title">
    <select class="input-category">
      <option value="" disabled selected>Category</option>
      <option value="Development">Development</option>
      <option value="Meeting">Meeting</option>
      <option value="Design">Design</option>
    </select>
    <div class="timer">
      <span class="timer-display">00:00:09</span>
      <button class="btn-start">Start</button>
    </div>
    <textarea placeholder="Add Description" class="input-description"></textarea>
    <textarea placeholder="Add Remarks" class="input-remarks"></textarea>
  </div>

  <!-- Time Entries Section -->
  <div class="time-entries">
    <h2>Time Entries</h2>
    <div class="entry">
      <div class="entry-left">
        <h3>Team Meeting</h3>
        <p class="entry-category">Team Meeting</p>
        <p class="entry-description">Weekly sprint planning<br>Discussed new feature requirements.</p>
      </div>
      <div class="entry-right">
        <div class="entry-time">
          <span class="time">01:00:51</span>
          <span class="date">11-05-24</span>
        </div>
        <div class="entry-actions">
          <button class="btn-edit">✏ Edit</button>
          <button class="btn-delete">🗑 Delete</button>
        </div>
      </div>
    </div>
    <div class="entry">
      <div class="entry-left">
        <h3>Homepage Development</h3>
        <p class="entry-category">Frontend Development</p>
        <p class="entry-description">Implementing new design<br>Completed header section</p>
      </div>
      <div class="entry-right">
        <div class="entry-time">
          <span class="time">03:10:01</span>
          <span class="date">08-05-24</span>
        </div>
        <div class="entry-actions">
          <button class="btn-edit">✏ Edit</button>
          <button class="btn-delete">🗑 Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
